name: ComfyUIMobile
options:
  bundleIdPrefix: net.comfyuimob
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  ComfyUIMobile:
    type: application
    platform: iOS
    sources:
      # Swift + asset catalog compile normally; exclude the Web folder here so
      # it can be added as a folder reference (preserving its subdirectory
      # structure in the bundle) below.
      - path: ComfyUIMobile
        excludes:
          - "Web"
          - "Info.plist"
      - path: ComfyUIMobile/Web
        type: folder
    info:
      path: ComfyUIMobile/Info.plist
      properties:
        CFBundleDisplayName: ComfyUI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSLocalNetworkUsageDescription: "Connect to your ComfyUI server running on your local network."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.comfyuimob.ComfyUIMobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
